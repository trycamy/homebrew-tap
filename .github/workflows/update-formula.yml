name: Update formula

# Regenerates Formula/camy.rb from the camy release channel
# (https://dl.camy.sh/stable/) whenever a new 1.x version is published there:
# it downloads that version's checksum manifest, verifies the manifest's
# cosign signature with the signing workflow's identity pinned, and writes
# the formula with the per-platform tarball URLs and SHA-256 values from the
# manifest. Runs with this repository's own token. The formula is never
# hand-edited.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: the channel's current VERSION)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

env:
  CHANNEL: https://dl.camy.sh/stable
  SIGNER: '^https://github\.com/CamyAI/camy-cli/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT:-$(curl -fsSL --retry 3 --proto '=https' --tlsv1.2 "$CHANNEL/VERSION" | tr -cd '0-9A-Za-z.-')}"
          case "$v" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::unexpected VERSION '$v'"; exit 1 ;; esac
          echo "skip=true" >> "$GITHUB_OUTPUT"
          case "$v" in 0.*) echo "::notice::$v is a pre-1.0 internal version; the tap publishes 1.x only"; exit 0 ;; esac
          if [ -f Formula/camy.rb ] && grep -q "version \"$v\"" Formula/camy.rb; then echo "::notice::formula already at $v"; exit 0; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.v.outputs.skip == 'false'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Verify the manifest and write the formula
        if: steps.v.outputs.skip == 'false'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          for f in "SHA256SUMS-$V" "SHA256SUMS-$V.sig" "SHA256SUMS-$V.pem"; do
            curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 -o "$f" "$CHANNEL/$f"
          done
          cosign verify-blob \
            --certificate "SHA256SUMS-$V.pem" --signature "SHA256SUMS-$V.sig" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$SIGNER" \
            "SHA256SUMS-$V"
          sum() { awk -v f="camy_${V}_$1.tar.gz" '($2 == f || $2 == "*" f) { print $1; exit }' "SHA256SUMS-$V"; }
          for p in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            [ -n "$(sum "$p")" ] || { echo "::error::no checksum for $p in SHA256SUMS-$V"; exit 1; }
          done
          mkdir -p Formula
          cat > Formula/camy.rb <<RB
          # Generated by .github/workflows/update-formula.yml from the camy release
          # channel; the checksums are the ones in the cosign-verified
          # SHA256SUMS-$V. Do not edit by hand.
          class Camy < Formula
            desc "Camy in your terminal: the same agent, memory, and cloud computer you use at camy.ai"
            homepage "https://camy.ai"
            version "$V"
            license :cannot_represent

            on_macos do
              on_arm do
                url "$CHANNEL/camy_${V}_darwin_arm64.tar.gz"
                sha256 "$(sum darwin_arm64)"
              end
              on_intel do
                url "$CHANNEL/camy_${V}_darwin_amd64.tar.gz"
                sha256 "$(sum darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "$CHANNEL/camy_${V}_linux_arm64.tar.gz"
                sha256 "$(sum linux_arm64)"
              end
              on_intel do
                url "$CHANNEL/camy_${V}_linux_amd64.tar.gz"
                sha256 "$(sum linux_amd64)"
              end
            end

            def install
              bin.install "camy"
              bash_completion.install "completions/camy.bash" => "camy" if File.exist?("completions/camy.bash")
              zsh_completion.install "completions/camy.zsh" => "_camy" if File.exist?("completions/camy.zsh")
              fish_completion.install "completions/camy.fish" if File.exist?("completions/camy.fish")
              man1.install Dir["manpages/*.1.gz"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/camy version")
            end
          end
          RB
          sed -i 's/^          //' Formula/camy.rb
          rm -f "SHA256SUMS-$V" "SHA256SUMS-$V.sig" "SHA256SUMS-$V.pem"
          cat Formula/camy.rb

      - name: Commit and push
        if: steps.v.outputs.skip == 'false'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/camy.rb
          git commit -m "camy $V"
          git push origin HEAD:main
